<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="template_layout_navbar">
<head>
  <meta charset="utf-8"/>
  <title>Home</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body>
<div layout:fragment="content1">

  <div class="container">
    <div class="row">
      <div class="col-6">

      </div>

    </div>
    <div class="row"><h2>User List</h2></div>
    <div class="row">
      <a href="/user/add" class="btn btn-primary btn-sm">Add New</a>
      <table class="table table-bordered">
        <thead>
        <tr>
          <th>Id</th>
          <th>Full Name</th>
          <th>User Name</th>
          <th>Role</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
          <td style="width: 10%" th:text="${user.id}"></td>
          <td th:text="${user.fullname}"></td>
          <td th:text="${user.username}"></td>
          <td style="width: 25%" th:text="${user.role}"></td>
          <td style="width: 15%" class="text-center">
            <a th:href="@{/admin/user/update/{id}(id=${user.id})}">Edit</a>&nbsp;|&nbsp;
            <a th:href="@{/admin/user/delete/{id}(id=${user.id})}">Delete</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
