<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Home</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body>
<div class="container">

    <div class="row">
        <h2>Update User</h2>
    </div>

    <div class="row">
        <form action="#" th:action="@{/admin/user/update/{id}(id=${userId})}" th:object="${userRoleEditRequest}" method="post" class="form-horizontal" style="width: 100%">
            <div class="form-group">
                <label for="fullname" class="col-sm-2 control-label">Full Name</label>
                <div class="col-sm-10">
                    <input type="text" th:field="*{fullname}" id="fullname" placeholder="Full Name" class="col-4">
                    <p class="text-danger" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></p>
                </div>
            </div>
            <div class="form-group">
                <label for="username" class="col-sm-2 control-label">User Name</label>
                <div class="col-sm-10">
                    <input type="text" th:field="*{username}" id="username" placeholder="User Name" class="col-4">
                    <p class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                </div>
            </div>

            <div class="form-group">
                <label for="role" class="col-sm-2 control-label">Role</label>
                <div class="col-sm-10">
                    <!-- Add current role display for debugging -->
                    <p th:text="'Current role: ' + ${userRoleEditRequest.role}" class="text-muted"></p>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio"
                               th:field="*{role}"
                               th:value="ROLE_ADMIN"
                               id="roleAdmin">
                        <label class="form-check-label" for="roleAdmin">Admin</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio"
                               th:field="*{role}"
                               th:value="ROLE_USER"
                               id="roleUser">
                        <label class="form-check-label" for="roleUser">User</label>
                    </div>

                    <p class="text-danger" th:if="${#fields.hasErrors('role')}"
                       th:errors="*{role}"></p>
                </div>
            </div>


            <div class="form-group">
                <div class="col-sm-12">
                    <input type="hidden" th:field="${userId}">
                    <a class="btn btn-danger btn-sm" href="/admin/users">Cancel</a>
                    <input class="btn btn-primary btn-sm" type="submit" value="Update User">
                </div>
            </div>

        </form>
    </div>

</div>
</body>
</html>
